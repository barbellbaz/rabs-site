<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/jpeg" href="/images/Rabs-logo.jpeg" />
    <link rel="apple-touch-icon" href="/images/Rabs-logo.jpeg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <title>Residential As-Built Services — Precision As-Builts, Delivered in Days</title>
    <meta
      name="description"
      content="Residential As-Built Services (RABS) delivers laser-scanned as-built drawings to homeowners, contractors, and architects nationwide. 3–5 business day turnaround."
    />
    <link rel="canonical" href="https://residentialasbuiltservices.com/" />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#0f172a" />

    <!-- Open Graph -->
    <meta property="og:title" content="Residential As-Built Services — RABS" />
    <meta
      property="og:description"
      content="Precision as-builts. Delivered in days."
    />
    <meta property="og:type" content="website" />

    <!-- Structured data (schema.org HomeAndConstructionBusiness) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HomeAndConstructionBusiness",
        "name": "Residential As-Built Services",
        "alternateName": "RABS",
        "url": "https://residentialasbuiltservices.com/",
        "image": "https://residentialasbuiltservices.com/images/Rabs-logo.jpeg",
        "logo": "https://residentialasbuiltservices.com/images/Rabs-logo.jpeg",
        "description": "Laser-scanned as-built drawings of existing homes — floor plans, elevations, ceiling plans, roof plans, site plans, Revit models, and Matterport walkthroughs. Nationwide, 3-5 business day turnaround.",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "1300 Ave at Port Imperial, Suite 609",
          "addressLocality": "Weehawken Township",
          "addressRegion": "NJ",
          "postalCode": "07086",
          "addressCountry": "US"
        },
        "areaServed": {
          "@type": "Country",
          "name": "United States"
        },
        "sameAs": [
          "https://www.linkedin.com/company/dcms-network",
          "https://www.youtube.com/@dcmsnetworkmedia"
        ]
      }
    </script>

    <!-- Fonts: Instrument Serif + Geist + Geist Mono — lazy-loaded to avoid render blocking -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      onload="this.onload=null;this.rel='stylesheet'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600;700&family=Instrument+Serif:ital@0;1&display=swap"
      />
    </noscript>

    <!-- Expose build-time env to the app. Vite replaces %VITE_*% at build. -->
    <script>
      window.__RABS_GMAPS_KEY__ = "%VITE_GOOGLE_MAPS_API_KEY%";
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
